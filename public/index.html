<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DNS Checker</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <h1>DNS Checker</h1>
    <form id="lookup-form" class="lookup-form" autocomplete="off">
      <label class="field field-domain">
        <span>Domain or IP</span>
        <input id="domain" name="domain" type="text" inputmode="url" autocapitalize="off" spellcheck="false" placeholder="example.com" required>
      </label>
      <label class="field field-type" id="type-field">
        <span>Record type</span>
        <select id="type" name="type">
          <option value="A" selected>A</option>
          <option value="AAAA">AAAA</option>
          <option value="CNAME">CNAME</option>
          <option value="MX">MX</option>
          <option value="NS">NS</option>
          <option value="TXT">TXT</option>
          <option value="SOA">SOA</option>
          <option value="CAA">CAA</option>
          <option value="PTR">PTR</option>
          <option value="ALL">All common</option>
        </select>
      </label>
      <label class="field field-mode">
        <span>Check against</span>
        <select id="mode" name="mode">
          <option value="public" selected>Public resolvers</option>
          <option value="authoritative">Authoritative nameservers</option>
          <option value="email">Email (SPF, DMARC, DKIM, MX)</option>
        </select>
      </label>
      <label class="field field-selector" id="selector-field" hidden>
        <span>DKIM selector (optional)</span>
        <input id="selector" name="selector" type="text" autocapitalize="off" spellcheck="false" autocomplete="off" placeholder="google">
      </label>
      <button type="submit" id="submit">Look up</button>
    </form>
    <div id="selector-presets" class="presets" role="group" aria-label="Common DKIM selectors" hidden>
      <span class="presets-label">Common selectors</span>
      <button type="button" class="chip" data-selector="default">default</button>
      <button type="button" class="chip" data-selector="google">google</button>
      <button type="button" class="chip" data-selector="selector1">selector1</button>
      <button type="button" class="chip" data-selector="selector2">selector2</button>
      <button type="button" class="chip" data-selector="k1">k1</button>
      <button type="button" class="chip" data-selector="s1">s1</button>
      <button type="button" class="chip" data-selector="s2">s2</button>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
    <div id="error" class="error" role="alert" hidden></div>
    <div id="results"></div>
  </main>
  <footer class="site-footer">
    <p>Resolver diversity, not location diversity: public resolvers are anycast, so every query is answered by the node nearest this server.</p>
    <p><a href="/selftest.html">Resolver self-test</a></p>
  </footer>
  <script src="/app.js" defer></script>
</body>
</html>
